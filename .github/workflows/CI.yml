name: CI - PROJETO TEIA

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Maven
        run: sudo apt-get install maven -y 

      - name: Build backend
        run: |
          cd sitebackend
          mvn clean test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Frontend tests
        run: |
          cd frontend
          npm install
          npm test -- --watchAll=false

      - name: Frontend build
        run: |
          cd frontend
          npm run build